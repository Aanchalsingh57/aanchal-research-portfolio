# Explicitly configure your own PostgreSQL URL. No paid database is provisioned.
services:
  - type: web
    name: aanchal-research-portfolio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BASE_URL
        sync: false
      - key: SITE_INDEXABLE
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
